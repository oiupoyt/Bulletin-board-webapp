<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Modulus Bulletin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12.4">
  <link rel="alternate icon" href="/favicon.ico?v=12.4">
  <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/style.min.css?v=12.4">
  <link rel="stylesheet" href="/css/admin.min.css?v=12.4">
</head>
<body>
  <main class="container auth-page">
    <div class="login-box">
      <div class="login-head">
        <img class="brand-mark" src="/favicon.svg?v=12.4" alt="" width="36" height="36">
        <h1>Sign in to admin</h1>
        <p>Publish announcements, syllabus, phase tests and answer keys.</p>
      </div>

      <form id="loginForm" class="login-card" novalidate>
        <div id="loginError" class="form-alert" role="alert" hidden></div>
        <div class="form-group">
          <label for="adminPassword" class="form-label">Password</label>
          <input type="password" id="adminPassword" class="form-control" required autofocus autocomplete="current-password" />
        </div>
        <button type="submit" id="btnLogin" class="btn btn-block">Sign in</button>
      </form>

      <p class="login-foot"><a href="https://mod.oiupoyt.space">Back to the bulletin</a></p>
    </div>
  </main>

  <script src="/js/login.js?v=12.4"></script>
</body>
</html>
