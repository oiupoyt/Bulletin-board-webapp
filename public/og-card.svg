<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Modulus Bulletin</title>
  <!-- Share card: the mark, the name, one line of what it is. Rendered to og-image.png by
       scripts/build-brand.mjs. -->
  <rect width="1200" height="630" fill="#111113"/>
  <g transform="translate(96 96) scale(0.3125)">
    <rect width="512" height="512" rx="112" fill="#1d1d21"/>
    <rect x="104" y="112" width="26" height="288" rx="13" fill="#ececee"/>
    <rect x="382" y="112" width="26" height="288" rx="13" fill="#ececee"/>
    <path d="M188 344V168l68 92 68-92v176" fill="none" stroke="#f5c518" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="96" y="404" fill="#ececee" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="600" letter-spacing="-2">Modulus Bulletin</text>
  <text x="96" y="468" fill="#9d9da2" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="32">Announcements, weekly syllabus, phase tests and answer keys.</text>
  <text x="96" y="550" fill="#6c6c71" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="26">mod.oiupoyt.space</text>
