  <text x="96" y="404" fill="#141417" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="600" letter-spacing="-3">Modulus Bulletin</text>
  <text x="96" y="468" fill="#8c8c94" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="32">Announcements, weekly syllabus, phase tests and answer keys.</text>
  <text x="96" y="550" fill="#6e6e76" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="26">mod.oiupoyt.space</text>
