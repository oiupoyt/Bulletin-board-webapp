       og-image.png by scripts/build-brand.mjs. -->
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d44c"/><stop offset=".5" stop-color="#f5c518"/><stop offset="1" stop-color="#e9a80c"/></linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0.55"><stop offset=".2" stop-color="#141428" stop-opacity="0"/><stop offset=".3" stop-color="#141428" stop-opacity=".035"/><stop offset=".42" stop-color="#141428" stop-opacity="0"/><stop offset=".6" stop-color="#141428" stop-opacity="0"/><stop offset=".7" stop-color="#141428" stop-opacity=".03"/><stop offset=".82" stop-color="#141428" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#fafafb"/>
