<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements &amp; Student Bulletin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8.3">
  <link rel="alternate icon" href="/favicon.ico?v=8.3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8.3">
  <link rel="manifest" href="/manifest.webmanifest?v=8.3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Modulus-bulletin">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Modulus Bulletin">
  <meta property="og:url" content="https://mod.oiupoyt.space/">
  <meta property="og:title" content="Modulus Bulletin">
  <meta property="og:description" content="Announcements, weekly syllabus, phase tests and answer keys for the college campus.">
  <meta property="og:image" content="https://mod.oiupoyt.space/og-image.png?v=8.3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Modulus Bulletin: faceted yellow M on black, title text, amber rule">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mod.oiupoyt.space/">
  <meta name="twitter:title" content="Modulus Bulletin">
  <meta name="twitter:description" content="Announcements, weekly syllabus, phase tests and answer keys for the college campus.">
  <meta name="twitter:image" content="https://mod.oiupoyt.space/og-image.png?v=8.3">
  <link rel="stylesheet" href="/css/style.css?v=8.3">
</head>
<body>

  <!-- Minimal Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <nav class="nav-links">
        <a href="/" class="nav-link active">Announcements</a>
        <a href="/syllabus" class="nav-link"><span class="desktop-only">Weekly </span>Syllabus</a>
        <a href="/phase-test" class="nav-link">Phase Test</a>
        <a href="/answer-keys" class="nav-link">Answer Keys</a>
        <button id="btnToggleNotifications" class="notif-toggle-btn" type="button" title="Enable alerts" aria-pressed="false">
          <span class="notif-bell" data-icon="bell" data-icon-size="20"></span><span class="notif-btn-label">Alerts</span>
        </button>
      </nav>
    </div>
  </header>

  <div id="toastRegion" class="toast-region" aria-live="polite" role="status"></div>

  <!-- Main Content -->
  <main class="container">
    <div class="page-header">
      <div class="page-eyebrow"><span class="eyebrow-dot"></span> Student Bulletin</div>
      <h1 class="page-title">Announcements &amp; Circulars</h1>
      <p class="page-subtitle">Campus updates, academic circulars, test notifications, and holiday advisories.</p>
    </div>

    <!-- Search & Filter Controls -->
    <section class="filter-card" aria-label="Filters">
      <!-- Search Input -->
      <div class="search-box">
        <span class="search-icon" data-icon="search" data-icon-size="18"></span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search notices by keyword or subject..." autocomplete="off" />
      </div>

      <!-- Category Filter Pills -->
      <div class="filter-row">
        <div class="category-pills" id="categoryPills">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </section>

    <!-- Announcements Feed -->
    <section id="announcementsList" class="feed-list" aria-label="Feed">
      <!-- Cards rendered dynamically -->
    </section>
  </main>

  <!-- Lightbox Modal for Full Image Zoom -->
  <div id="lightboxModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="lightboxCloseBtn" class="modal-close-btn" aria-label="Close image" data-icon="close" data-icon-size="22"></button>
      <img id="lightboxImg" class="modal-img" src="" alt="Full view" />
    </div>
  </div>

  <!-- Centered Footer with Muted Disclaimer & Centered Instagram -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-instagram-center">
        <a href="https://instagram.com/oiupoyt" target="_blank" rel="noopener noreferrer" class="footer-ig-link" title="Contact on Instagram @oiupoyt">
          <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">

          </svg>
          <span>@oiupoyt</span>
        </a>
      </div>
      <button type="button" id="footerInstallBtn" class="footer-install-link" hidden>Install as app</button>
      <p class="disclaimer-text">This is an unofficial, student-made bulletin and not an official college portal.*</p>
    </div>
  </footer>

  <script src="/js/icons.js?v=8.3"></script>
  <script src="/js/marked.umd.js?v=8.3"></script>
  <script src="/js/purify.min.js?v=8.3"></script>
  <script src="/js/app.js?v=8.3"></script>
  <script src="/js/notifications.js?v=8.3"></script>
  <script src="/js/install.js?v=8.3"></script>
</body>
</html>
